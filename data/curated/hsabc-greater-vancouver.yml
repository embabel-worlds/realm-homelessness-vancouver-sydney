# Figures transcribed from the HSABC "2025 Point-in-Time Homeless Count in Greater Vancouver" final
# report (data/source/hsabc_2025_final.pdf), which is published only as a PDF. Each block names the
# table it comes from. scripts/build_reference.py reads this file; tests/ground_truth.py checks that
# sub-regions add up to the regional totals and that sheltered + unsheltered = total.
#
# Quirk in the source: Table 3's "Total" row prints 2,174 for 2008; Table 2 and the sum of its own
# sheltered and unsheltered rows give 2,660, which is used here. And Table 2's sub-regions add up
# to the regional total only from 2017: for 2005, 2008, 2011 and 2014 (when Delta and White Rock
# are n/a) they fall short by 12, 17, 14 and 19. Both are transcribed as printed.

report: "2025 Point-in-Time Homeless Count in Greater Vancouver (Homelessness Services Association of BC)"
url: "https://hsa-bc.ca/_Library/2025_HC/2025_Point-in-Time_Homeless_Count_for_Greater_Vancouver_Final_Report.pdf"

# Table 3 — regional sheltered / unsheltered / total, 2005–2025 (all counts held in March).
regional:
