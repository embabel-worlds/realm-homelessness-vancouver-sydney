- type: HomelessnessSource
  data:
    sourceId: hsabc-pit
    city: Vancouver
    tier: oneNightStreetAndShelter
    name: Greater Vancouver Point-in-Time Homeless Count
    publisher: Homelessness Services Association of BC (for Reaching Home, Government of Canada)
    method: 'One night and the following day in March, roughly every three years since 2005: volunteers survey people outdoors and shelters, transition houses, hospitals and police cells report who stayed with them.'
    whoIsCounted: 'Sheltered: emergency shelters, extreme-weather beds, transition and safe houses, and people in hospital or police cells with no fixed address. Unsheltered: sleeping outside, in tents, vehicles, vacant buildings, AND staying temporarily at someone else''s place (couch-surfing).'
    cadence: 2005, 2008, 2011, 2014, 2017, 2020, 2023, 2025
    licence: Copyright HSABC; figures reproduced with attribution (no open licence stated).
    url: https://hsa-bc.ca/_Library/2025_HC/2025_Point-in-Time_Homeless_Count_for_Greater_Vancouver_Final_Report.pdf
    caveats: 'A minimum count: people not met and not in a facility are missed. Demographics are of survey respondents only (about 3,000 of 5,232 in 2025). Unsheltered includes couch-surfers, so it is wider than Sydney''s rough-sleeper counts.'
