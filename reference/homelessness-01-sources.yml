- type: HomelessnessSource
  data:
    sourceId: abs-census
    city: Sydney
    tier: censusEstimate
    name: 'ABS Estimating Homelessness: Census'
    publisher: Australian Bureau of Statistics (2049.0)
    method: Census night records classified into six operational groups by the ABS statistical definition of homelessness.
    whoIsCounted: Improvised dwellings, tents or sleeping out; supported accommodation for the homeless; staying temporarily with other households; boarding houses; other temporary lodging; and 'severely' crowded dwellings (4+ extra bedrooms needed).
    cadence: 'Every census: 2006, 2011, 2016, 2021'
    licence: CC BY 4.0, Australian Bureau of Statistics
    url: https://www.abs.gov.au/statistics/people/housing/estimating-homelessness-census/2021
    caveats: 'Much broader than any Canadian count: severe crowding (about half of Greater Sydney''s total) and boarding houses are not homelessness in Canada. The 2021 census fell in Sydney''s Delta lockdown, which pushed rough sleeping far down (City of Sydney 64 in 2021 vs 631 in 2016). Cells are randomly adjusted, so parts may not add to totals.'
