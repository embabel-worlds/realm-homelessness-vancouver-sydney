    tier: oneNightStreet
    name: NSW Statewide Street Count
    publisher: Homes NSW, Department of Communities and Justice
    method: One night in February or March each year, scheduled locations in each counted LGA, using the City of Sydney method.
    whoIsCounted: People sleeping rough only. People on boats (NSW Maritime) are reported separately and excluded.
